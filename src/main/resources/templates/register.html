<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>UniGuideKE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- global.css -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">

<div class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-sm sm:max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Sign Up</h2>

    <!-- Error message if registration fails -->
    <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded-md mb-4 text-center">
        <span th:text="${error}"></span>
    </div>

    <form action="#" th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">
        <div>
            <label class="block text-base">Name:</label>
            <input type="text" th:field="*{name}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block text-base">Student Email:</label>
            <input type="email" th:field="*{email}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block text-base">Password:</label>
            <div class="relative">
                <input type="password" id="passwordField" name="password" th:field="*{password}" required minlength="6"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 pr-10" />

                <!-- Eye icon -->
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-500">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 3C4.477 3 0 10 0 10s4.477 7 10 7 10-7 10-7-4.477-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
                        <circle cx="10" cy="10" r="3"/>
                    </svg>
                </button>

            </div>
        </div>

        <div>
            <label class="block text-base">Name of Your University:</label>
            <input type="text" th:field="*{universityName}"
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required />
        </div>

        <div>
            <label class="block text-base">User Type:</label>
            <select th:field="*{userType}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <option th:each="type : ${userTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
        </div>

        <button type="submit"
                class="w-full bg-blue-500 text-white py-2 rounded-lg text-lg font-medium hover:bg-blue-600 transition">
            Register
        </button>
    </form>

</div>

<script>
    function togglePassword() {
        let passwordField = document.getElementById("passwordField");
        let eyeIcon = document.getElementById("eyeIcon");

        if (passwordField.type === "password") {
            passwordField.type = "text"; // Show password
            eyeIcon.innerHTML = `<path d="M10 3C4.477 3 0 10 0 10s4.477 7 10 7 10-7 10-7-4.477-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/><path d="M2 10s2.5-4 8-4 8 4 8 4-2.5 4-8 4-8-4-8-4z"/>`; // Open eye
        } else {
            passwordField.type = "password"; // Hide password
            eyeIcon.innerHTML = `<path d="M10 3C4.477 3 0 10 0 10s4.477 7 10 7 10-7 10-7-4.477-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/><circle cx="10" cy="10" r="3"/>`; // Closed eye
        }
    }
</script>

</body>
</html>
