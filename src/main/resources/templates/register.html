<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>UniGuideKE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- global.css -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Sign Up</h2>

    <form action="#" th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">
        <div>
            <label class="block text-base">Name:</label>
            <input type="text" th:field="*{name}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block text-base">Email:</label>
            <input type="email" th:field="*{email}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block text-base">Password:</label>
            <input type="password" th:field="*{password}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block text-base">University Name:</label>
            <input type="text" th:field="*{universityName}"
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block text-base">User Type:</label>
            <select th:field="*{userType}"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <option th:each="type : ${userTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
        </div>

        <button type="submit"
                class="w-full bg-blue-500 text-white py-2 rounded-lg text-lg font-medium hover:bg-blue-600 transition">
            Register
        </button>
    </form>
</div>

</body>
</html>
