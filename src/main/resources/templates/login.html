<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>UniGuideKE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- global.css -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">

<div class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-sm sm:max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded-md mb-4 text-center">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${success}" class="bg-green-100 text-green-700 p-3 rounded-md mb-4 text-center">
        <span th:text="${success}"></span>
    </div>

    <form th:action="@{/login}"  method="post" class="space-y-4">
        <input type="hidden" name="redirectUrl" th:value="${redirectUrl}">

        <div>
            <label class="block text-base">Email:</label>
            <input type="email" name="username" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="relative">
            <label class="block text-base">Password:</label>
            <input type="password" id="passwordFieldLogin" name="password" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />

            <!-- Eye icon -->
            <button type="button" id="togglePasswordBtn" onclick="togglePassword()"
                    class="absolute right-3 top-9 text-gray-500 hover:text-gray-700 focus:outline-none">
                <svg id="eyeIconLogin" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <button type="submit"
                class="w-full bg-blue-500 text-white py-2 rounded-lg text-lg font-medium hover:bg-blue-600 transition">
            Login
        </button>

        <p class="text-center mt-4">
            Don't have an account? <a href="/registration-form" class="text-blue-500">Sign up</a>
        </p>
    </form>
</div>

<script>
    function togglePassword() {
        const passwordField = document.getElementById("passwordFieldLogin");
        const eyeIcon = document.getElementById("eyeIconLogin");

        if (passwordField.type === "password") {
            passwordField.type = "text"; // Show password
            // Change to "hide" icon (eye with slash)
            eyeIcon.innerHTML = `
                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
            `;
        } else {
            passwordField.type = "password"; // Hide password
            // Change to "show" icon (eye)
            eyeIcon.innerHTML = `
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
            `;
        }
    }
</script>

</body>
</html>
