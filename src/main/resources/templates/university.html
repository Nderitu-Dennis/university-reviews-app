<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>
    <title th:text="${uniName} + ' - UniGuideKE'"></title>
    <!-- global.css -->
    <link rel="stylesheet" th:href="@{css/global.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 pt-18">

<!--  Include Navbar -->
<div th:replace="~{fragments/navbar :: nav}"></div>

<!-- Hero Section -->
<section class="relative w-full h-[250px] sm:h-[300px] md:h-[400px] lg:h-[500px] mt-[72px]">
    <div class="absolute inset-0 overflow-hidden">
        <img th:src="@{/images/universities/{heroImage}(heroImage=${university.heroImage})}"
             alt="University Image"
             class="w-full h-full object-cover">
    </div>
</section>

<div id="overview-section" class="container mx-auto p-6 grid grid-cols-3 gap-6">

    <div class="bg-white shadow-lg rounded-lg p-6 col-span-2">
        <!-- Left Column (2/3) -->
        <h2 class="text-2xl font-bold text-blue-600 mb-4">Academic Programs</h2>

        <div th:if="${programs == null || programs.isEmpty()}" class="text-center py-4">
            <p class="text-gray-500">Loading program information...</p>
        </div>

        <div th:if="${!programs.isEmpty()}" class="mt-2">
            <ul class="list-disc pl-5 space-y-1 columns-1 md:columns-2 lg:columns-4">
                <li th:each="program : ${programs}" th:text="${program}" class="text-gray-700 break-inside-avoid"></li>
            </ul>
        </div>
    </div>


    <!-- Right Column: Fun Fact -->
    <div class="flex flex-col gap-6 col-span-1">
        <!--  AI Fun Fact Section -->
        <section class="bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-2xl font-bold text-blue-600">Did You Know?</h2>

            <!-- Display Fun Fact -->
            <p id="funFactText"
               class="text-gray-700 mt-2 mb-2 p-2 "
               th:text="${funFact}">
            </p>

            <!-- Generate Fun Fact Button -->
            <button onclick="fetchFunFact()"
                    class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                Discover an interesting Fact about <span th:text="${university.name}"></span>
            </button>

            <script>
                function fetchFunFact() {
                    let universityName = "[[${university.name}]]";  // Fetch university name dynamically
                    fetch(`/funfact/${universityName}`)
                        .then(response => response.text())
                        .then(data => document.getElementById('funFactText').innerText = data)
                        .catch(error => console.error('Error fetching fun fact:', error));
                }
            </script>
        </section>



    </div>

</div>

<!-- Review Section -->
<section>


<div class="bg-blue-100 p-4 rounded-lg flex items-center justify-between shadow-md">
    <h2 class="text-2xl font-bold text-blue-600">Reviews</h2>
    <div class="flex-1 flex justify-center">
        <th:block sec:authorize="isAuthenticated()">
            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow-md hover:bg-blue-700"
                    onclick="document.getElementById('reviewModal').classList.remove('hidden')">
                + Write a Review
            </button>
        </th:block>

            <!-- Show a message for unauthenticated users -->
        <th:block sec:authorize="!isAuthenticated()">
            <!-- Show the same button, but handle it differently for unauthenticated users -->
            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow-md hover:bg-blue-700"
                    onclick="document.getElementById('loginPrompt').classList.remove('hidden')">
                + Write a Review
            </button>
        </th:block>
    </div>
</div>

    <!-- Modal for login prompt -->
    <div id="loginPrompt" class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <p class="text-red-700 text-center">You must log in to submit a review</p>
            <div class="mt-4 flex justify-center">
                <a th:href="@{/login(redirectUrl=${currentRequestUri})}"
                   class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow-md hover:bg-blue-700">
                    Log In
                </a>
            </div>
            <button class="mt-4 block mx-auto text-gray-500 hover:text-gray-700"
                    onclick="document.getElementById('loginPrompt').classList.add('hidden')">
                Close
            </button>
        </div>
    </div>

    <div th:if="${reviews != null and #lists.isEmpty(reviews)}" class="text-center mt-4">
        <p class="text-gray-500">No reviews yet. Be the first to review!</p>
    </div>

    <!--view  Reviews card-->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">
        <div th:each="review : ${reviews}" class="bg-gray-50 border border-gray-200 p-4 rounded-lg shadow-md">
            <div class="flex justify-between items-center">
                <h3 class="font-semibold text-lg text-gray-800" th:text="${review.title}"></h3>
                <span class="text-gray-500 text-sm"> Verified User</span>
            </div>
            <p class="text-gray-700 mt-2" th:text="${review.reviewText}"></p>
            <p class="text-sm text-yellow-500 mt-2">⭐ <span th:text="${review.rating}"></span> stars</p>
            <p class="text-xs text-gray-400 mt-2" th:text="${#dates.format(review.createdAt, 'dd-MM-yyyy')}"></p>

            <!-- Edit & Delete Buttons only for a review owner -->
            <div class="mt-3 flex justify-between">
                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <!-- Hide edit & delete buttons if a user is not logged in -->
                    <th:block th:if="${review.user.email == #authentication.name}">
                        <!-- Edit Button -->
                        <button class="bg-blue-500 text-white px-3 py-1 rounded shadow-md hover:bg-blue-700"
                                th:attr="data-review-id=${review.id},
                             data-title=${review.title},
                             data-review-text=${review.reviewText},
                             data-rating=${review.rating}"
                                onclick="openEditModal(this)">
                            Edit
                        </button>

                        <!-- Delete Button -->
                        <form th:action="@{/reviews/delete}" method="post" onsubmit="return confirmDelete(event)">
                            <input type="hidden" name="reviewId" th:value="${review.id}" />
                            <input type="hidden" name="reviewedUniversity" th:value="${uniName}" />
                            <button type="submit" class="bg-gray-500 text-white px-3 py-1 rounded shadow-md hover:bg-gray-600">
                                Delete
                            </button>
                        </form>
                    </th:block>
                </th:block>
            </div>
        </div>
    </div>
</section>
                <!-- Confirm delete -->
                <script>
                    function confirmDelete(event) {
                        let confirmAction = confirm("Are you sure you want to delete this review?");
                        if (!confirmAction) {
                            event.preventDefault(); // Stop the form submission if canceled
                        }
                        return confirmAction;
                    }
                </script>

            <!-- Review Modal (Hidden by default) -->
<!-- Write Review Modal -->
<div id="reviewModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-sm sm:max-w-md relative">
        <!-- Close Button -->
        <button class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
                onclick="document.getElementById('reviewModal').classList.add('hidden')">
            ✖
        </button>

        <h3 class="text-xl font-semibold text-gray-700 text-center">Submit Your Review</h3>

        <th:block sec:authorize="isAuthenticated()">
            <form th:action="@{/reviews/submit}" method="post" class="review-form mt-2">
                <input type="hidden" name="reviewedUniversity" th:value="${uniName}">

                <!-- Add CSRF token explicitly -->
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="block text-gray-700 font-medium mt-2">Title</label>
                <input type="text" name="title" class="border p-2 w-full rounded-lg focus:outline-none focus:ring focus:ring-blue-300" required>

                <label class="block text-gray-700 font-medium mt-3">Rating</label>
                <select name="rating" class="border p-2 w-full rounded-lg focus:outline-none focus:ring focus:ring-yellow-300" required>
                    <option value="">Select Rating</option>
                    <option value="5">⭐️⭐️⭐️⭐️⭐️</option>
                    <option value="4">⭐️⭐️⭐️⭐️</option>
                    <option value="3">⭐️⭐️⭐️</option>
                    <option value="2">⭐️⭐️</option>
                    <option value="1">⭐️</option>
                </select>

                <label class="block text-gray-700 font-medium mt-3">Your Review</label>
                <textarea name="reviewText"
                          class="border p-2 w-full h-32 rounded-lg focus:outline-none focus:ring focus:ring-green-300 resize-none"
                          required
                          onpaste="return false"
                          ondrop="return false"
                          minlength="30"
                          placeholder="Share your experience (min 30 characters)"
                          id="reviewText"></textarea>

                <!-- Prevent form submission if input is less than 30 characters -->
                <script>
                    document.querySelector(".review-form").addEventListener("submit", function(event) {
                        let reviewText = document.getElementById("reviewText").value.trim();

                        if (reviewText.length < 30) {
                            alert("Your review must be at least 30 characters.");
                            event.preventDefault(); // Stop form submission
                        }
                    });
                </script>

                <button type="submit" class="mt-4 bg-green-600 text-white px-5 py-2 rounded-lg w-full shadow-md hover:bg-green-700">
                    Submit Review
                </button>
            </form>
        </th:block>
    </div>
</div>

<!-- Edit Review Modal -->
<div id="editReviewModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-sm sm:max-w-md relative">
        <button class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
                onclick="closeEditModal()">✖</button>
        <h3 class="text-xl font-semibold text-gray-700 text-center">Edit Your Review</h3>

        <form id="editReviewForm" method="post" th:action="@{/reviews/edit}">
            <input type="hidden" name="reviewId" id="editReviewId">
            <input type="hidden" name="reviewedUniversity" th:value="${uniName}" />

            <!-- Add CSRF token explicitly -->
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label class="block text-gray-700 font-medium mt-2">Title</label>
            <input type="text" name="title" id="editTitle" class="border p-2 w-full rounded-lg focus:outline-none focus:ring focus:ring-blue-300" required>

            <label class="block text-gray-700 font-medium mt-3">Rating</label>
            <select name="rating" id="editRating" class="border p-2 w-full rounded-lg focus:outline-none focus:ring focus:ring-yellow-300" required>
                <option value="5">⭐️⭐️⭐️⭐️⭐️</option>
                <option value="4">⭐️⭐️⭐️⭐️</option>
                <option value="3">⭐️⭐️⭐️</option>
                <option value="2">⭐️⭐️</option>
                <option value="1">⭐️</option>
            </select>

            <label class="block text-gray-700 font-medium mt-3">Your Review</label>
            <textarea name="reviewText" id="editReviewText"
                      class="border p-2 w-full h-32 rounded-lg focus:outline-none focus:ring focus:ring-green-300 resize-none"
                      required
                      onpaste="return false"
                      ondrop="return false"></textarea>

            <button type="submit" class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg w-full shadow-md hover:bg-blue-700">
                Save Changes
            </button>
        </form>
    </div>
</div>

<!-- Link JavaScript Properly at the bottom -->
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/edit-reviews.js}"></script>

<!-- Include Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
